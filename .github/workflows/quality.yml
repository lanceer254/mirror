name: Zyntrix quality checks
on:
  push:
    branches: [main, zyntrix-data-engine-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check analysis engine syntax
        run: node --check analysis-engine.js
      - name: Run OVER 1 gate tests
        run: node --test analysis-engine.test.cjs
      - name: Check dashboard JavaScript syntax and markup IDs
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          for (const source of scripts) new Function(source);
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate IDs: ' + [...new Set(duplicates)].join(', '));
          for (const id of ['market','momentumPanel','over1GateStatus','tickWindowSwitch','eventFeed']) if (!ids.includes(id)) throw new Error('Missing ID: ' + id);
          if (ids.includes('scan') || ids.includes('analysisMode') || html.includes('parity-panel')) throw new Error('Removed parity/scanner UI has returned');
          if (!html.includes("start:Math.floor(Date.now()/1000)-1000") || !html.includes("end:'latest'") || !html.includes("style:'ticks'")) throw new Error('1000-second Deriv history request is missing');
          if (html.includes('processMarketTick')) throw new Error('Removed scanner tick hook remains');
          console.log('OVER/UNDER dashboard syntax and markup checks passed');
          NODE
