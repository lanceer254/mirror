<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digit Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1fa;--panel:#ffffff;--line:#d9d6ee;--ink:#1a1840;--mute:#6a6890;
  --accent:#6c4dff;--glow:rgba(108,77,255,.5);--win:#0f9d7a;--loss:#e0345a;--field:#f6f5fd;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e22;--panel:#141938;--line:#262c5a;--ink:#eceafc;--mute:#8e92c4;
  --accent:#9a83ff;--glow:rgba(154,131,255,.6);--win:#4be3bf;--loss:#ff6b8b;--field:#0f1330;}}
:root[data-theme="dark"]{
  --bg:#0b0e22;--panel:#141938;--line:#262c5a;--ink:#eceafc;--mute:#8e92c4;
  --accent:#9a83ff;--glow:rgba(154,131,255,.6);--win:#4be3bf;--loss:#ff6b8b;--field:#0f1330;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 40px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mute);font-size:.85rem}
.price{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price em{font-style:normal;color:var(--accent)}
.layout{display:grid;gap:18px}
@media(min-width:900px){.layout{grid-template-columns:1.35fr 1fr;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.stage{border-radius:28px;padding:26px 22px 22px;position:relative;overflow:hidden}
.digits{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.d{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .25s}
.d svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.d circle{fill:none;stroke-width:8;stroke-linecap:round}
.d .trk{stroke:var(--line)}
.d .fg{stroke:var(--accent);transition:stroke-dashoffset .5s,stroke .3s}
.d.hi .fg{stroke:var(--win)}.d.lo .fg{stroke:var(--loss)}
.d b{font-size:clamp(1.4rem,4.5vw,2rem);line-height:1;font-weight:700}
.d small{font-size:.7rem;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.d.hit{transform:scale(1.08)}
.cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:2;transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .3s,height .3s}
.cursor::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--accent);box-shadow:0 0 18px var(--glow),inset 0 0 14px var(--glow);animation:spin 7s linear infinite}
.cursor::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{position:absolute;top:0;bottom:0;width:90px;left:-120px;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.stage.scanning .sweep{opacity:.7;animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{to{left:100%}}
.actions{display:flex;align-items:center;gap:18px;margin-top:22px}
.brain{position:relative;flex:none;width:96px;height:96px;border-radius:50%;border:2px solid var(--accent);background:var(--field);color:var(--accent);cursor:pointer;display:grid;place-items:center;animation:breathe 2.8s ease-in-out infinite}
.brain svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--glow))}
.brain svg .n{fill:currentColor;stroke:none}
.brain:focus-visible,.field input:focus-visible,.field select:focus-visible,.ghost:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.brain:disabled{cursor:not-allowed;animation:none;opacity:.55;box-shadow:none}
.brain.scanning{animation:breathe .7s ease-in-out infinite}
.brain.scanning::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);animation:ripple 1.1s ease-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 14px var(--glow),inset 0 0 10px var(--glow)}50%{box-shadow:0 0 42px var(--glow),inset 0 0 22px var(--glow)}}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.say strong{display:block;font-size:1rem}
.say span{color:var(--mute);font-size:.85rem}
h2{font-size:.95rem;margin:0 0 12px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mute)}
.field input,.field select{font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.side{display:grid;gap:18px}
.total{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.pos{color:var(--win)}.neg{color:var(--loss)}
.stats{display:flex;gap:18px;margin:8px 0 14px;font-size:.85rem;color:var(--mute)}
.stats b{color:var(--ink)}
ul{list-style:none;margin:0;padding:0;font-size:.85rem;font-variant-numeric:tabular-nums}
li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
li span:first-child{color:var(--mute)}
.empty{color:var(--mute);font-size:.85rem}
.ghost{margin-top:12px;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.8rem;border-radius:10px;padding:7px 12px;cursor:pointer}
.tline{margin-top:12px;font-size:.85rem;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Digit scanner</h1>
      <p class="sub">Simulated 1-second ticks, paper trades only.</p>
    </div>
    <div class="price" id="price" aria-label="Latest price">0000.00</div>
  </header>

  <div class="layout">
    <section class="panel stage" id="stage" aria-label="Last digit distribution">
      <div class="digits" id="digits"><div class="cursor" id="cursor"></div></div>
      <div class="sweep"></div>
      <div class="actions">
        <button class="brain" id="scan" aria-label="Scan the last 25 ticks">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M31 10c-4-3-11-1-13 4-5 0-9 5-7 10-3 3-3 8 0 11-1 5 3 10 8 10 2 5 9 6 12 2z"/>
            <path d="M33 10c4-3 11-1 13 4 5 0 9 5 7 10 3 3 3 8 0 11 1 5-3 10-8 10-2 5-9 6-12 2z"/>
            <path d="M20 26c4 0 5 3 9 3M19 38c4 0 6-3 10-2M44 26c-4 0-5 3-9 3M45 38c-4 0-6-3-10-2"/>
            <circle class="n" cx="20" cy="26" r="1.8"/><circle class="n" cx="44" cy="26" r="1.8"/>
            <circle class="n" cx="19" cy="38" r="1.8"/><circle class="n" cx="45" cy="38" r="1.8"/>
          </svg>
        </button>
        <div class="say" aria-live="polite">
          <strong id="status">Ready to scan</strong>
          <span id="tline">No open trade</span>
        </div>
      </div>
    </section>

    <div class="side">
      <section class="panel" aria-label="Duration settings">
        <h2>Trade settings</h2>
        <label class="field" style="margin-bottom:10px">Market
          <select id="market"></select>
        </label>
        <label class="field" style="margin-bottom:10px">Contract
          <select id="contract">
            <option value="DIGITMATCH" disabled>Matches / Differs</option>
            <option value="DIGITOVER">Over / Under</option>
            <option value="DIGITEVEN" selected>Even / Odd</option>
            <option value="RUNHIGH">Only Ups / Only Downs</option>
            <option value="CALL">Rise / Fall</option>
            <option value="UPORDOWN">Up or Down</option>
          </select>
        </label>
        <label class="field" id="barrierBox" style="margin-bottom:10px">Barrier digit
          <select id="barrier"></select>
        </label>
        <div class="row">
          <label class="field">Duration
            <input id="dur" type="number" min="1" max="10" value="5" inputmode="numeric">
          </label>
          <label class="field">Unit
            <select id="unit">
              <option value="ticks">Ticks</option>
              <option value="minutes">Minutes</option>
            </select>
          </label>
        </div>
        <div class="row" style="margin-top:10px">
          <label class="field">Stake
            <input id="stake" type="number" min="0.35" step="0.01" value="1" inputmode="decimal">
          </label>
        </div>
      </section>

      <section class="panel" aria-label="Profit and loss">
        <h2>PnL</h2>
        <div class="total" id="total">0.00</div>
        <div class="stats">
          <span><b id="wins">0</b> wins</span>
          <span><b id="losses">0</b> losses</span>
          <span><b id="rate">0%</b> win rate</span>
        </div>
        <ul id="log"><li class="empty" style="border:0;padding:0">No trades yet.</li></ul>
        <button class="ghost" id="reset">Reset PnL</button>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var grid=$('#digits'),cur=$('#cursor'),C=2*Math.PI*42,cells=[],ds=[],ps=[],price=1000,lastPrice='',timer=null;
  var MK=[
    {n:'Volatility 10 (1s) Index',g:'1-second indices',s:.4,b:6540,ms:1000},
    {n:'Volatility 25 (1s) Index',g:'1-second indices',s:.8,b:2815,ms:1000},
    {n:'Volatility 50 (1s) Index',g:'1-second indices',s:1.2,b:318,ms:1000},
    {n:'Volatility 75 (1s) Index',g:'1-second indices',s:1.6,b:421900,ms:1000},
    {n:'Volatility 100 (1s) Index',g:'1-second indices',s:2,b:900,ms:1000},
    {n:'Volatility 10 Index',g:'Standard indices',s:.4,b:6540,ms:2000},
    {n:'Volatility 25 Index',g:'Standard indices',s:.8,b:2815,ms:2000},
    {n:'Volatility 50 Index',g:'Standard indices',s:1.2,b:318,ms:2000},
    {n:'Volatility 75 Index',g:'Standard indices',s:1.6,b:421900,ms:2000},
    {n:'Volatility 100 Index',g:'Standard indices',s:2,b:900,ms:2000}
  ];
  var CT={
    DIGITMATCH:{n:'Matches',bar:'any',p:function(){return .1}},
    DIGITDIFF:{n:'Differs',bar:'any',p:function(){return .9}},
    DIGITOVER:{n:'Over',bar:'over',p:function(b){return(9-b)/10}},
    DIGITUNDER:{n:'Under',bar:'under',p:function(b){return b/10}},
    DIGITEVEN:{n:'Even',p:function(){return .5}},
    DIGITODD:{n:'Odd',p:function(){return .5}},
    RUNHIGH:{n:'Only Ups',run:1,p:function(b,n){return Math.pow(.5,n)}},
    RUNLOW:{n:'Only Downs',run:1,p:function(b,n){return Math.pow(.5,n)}},
    CALL:{n:'Rise',p:function(){return .5}},
    PUT:{n:'Fall',p:function(){return .5}},
    UPORDOWN:{n:'Up or Down',p:function(){return .95}}
  };
  var PR={DIGITMATCH:['DIGITMATCH','DIGITDIFF'],DIGITOVER:['DIGITOVER','DIGITUNDER'],DIGITEVEN:['DIGITEVEN','DIGITODD'],RUNHIGH:['RUNHIGH','RUNLOW'],CALL:['CALL','PUT'],UPORDOWN:['UPORDOWN']};
  var mSel=$('#market'),og={};
  MK.forEach(function(m,i){
    var g=og[m.g];
    if(!g){g=document.createElement('optgroup');g.label=m.g;mSel.appendChild(g);og[m.g]=g}
    var o=document.createElement('option');o.value=i;o.textContent=m.n;g.appendChild(o);
  });
  var trade=null,busy=false,pnl=0,wins=0,losses=0,log=[],lastDigit=0;

  for(var i=0;i<10;i++){
    var d=document.createElement('div');d.className='d';
    d.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/></svg><b>'+i+'</b><small>10.0%</small>';
    grid.appendChild(d);cells.push(d);
  }

  var mk=MK[0];
  function nextTick(){price=Math.max(1,price+(Math.random()-.5)*mk.s);return price.toFixed(2)}
  function push(){lastPrice=nextTick();lastDigit=+lastPrice.slice(-1);ds.push(lastDigit);ps.push(+lastPrice);if(ds.length>100){ds.shift();ps.shift()}return lastDigit}
  function seed(){price=mk.b;ds=[];ps=[];for(var k=0;k<100;k++)push()}
  seed();

  function render(){
    var counts=Array(10).fill(0),n=ds.length,hi=0,lo=0;
    ds.forEach(function(x){counts[x]++});
    for(var i=1;i<10;i++){if(counts[i]>counts[hi])hi=i;if(counts[i]<counts[lo])lo=i}
    cells.forEach(function(c,i){
      var p=counts[i]/n;
      c.querySelector('.fg').style.strokeDasharray=C;
      c.querySelector('.fg').style.strokeDashoffset=C*(1-Math.min(1,p*5));
      c.querySelector('small').textContent=(p*100).toFixed(1)+'%';
      c.classList.toggle('hi',i===hi);c.classList.toggle('lo',i===lo);
    });
    $('#price').innerHTML=lastPrice.slice(0,-1)+'<em>'+lastPrice.slice(-1)+'</em>';
  }

  function moveCursor(i,flash){
    var c=cells[i];
    cur.style.width=(c.offsetWidth+14)+'px';cur.style.height=(c.offsetHeight+14)+'px';
    cur.style.transform='translate('+(c.offsetLeft-7)+'px,'+(c.offsetTop-7)+'px)';
    if(flash){c.classList.add('hit');setTimeout(function(){c.classList.remove('hit')},350)}
  }

  function limits(){
    var c=CT[$('#contract').value],u=$('#unit').value;
    return c.run?{min:2,max:5}:u==='ticks'?{min:1,max:10}:{min:1,max:60};
  }
  function cfg(){
    var id=$('#contract').value,c=CT[id],L=limits();
    var n=Math.min(L.max,Math.max(L.min,parseInt($('#dur').value,10)||L.min));
    var stake=Math.max(0.35,parseFloat($('#stake').value)||1);
    return{id:id,unit:c.run?'ticks':$('#unit').value,n:n,stake:stake,b:c.bar?+$('#barrier').value:null};
  }
  function applyLimits(reset){
    var c=CT[$('#contract').value],L=limits();
    $('#unit').disabled=!!c.run;
    if(c.run)$('#unit').value='ticks';
    $('#dur').min=L.min;$('#dur').max=L.max;
    if(reset)$('#dur').value=c.run?3:$('#unit').value==='ticks'?5:1;
  }
  function applyContract(keep){
    var c=CT[$('#contract').value],sel=$('#barrier'),lo=c.bar==='any'?0:1,hi=c.bar==='any'?9:8;
    $('#barrierBox').style.display=c.bar?'flex':'none';
    if(c.bar){
      var prev=sel.value;sel.innerHTML='';
      for(var i=lo;i<=hi;i++){var o=document.createElement('option');o.textContent=i;sel.appendChild(o)}
      sel.value=(prev!==''&&+prev>=lo&&+prev<=hi)?prev:String(Math.min(Math.max(5,lo),hi));
    }
    applyLimits(!keep);
  }
  function result(t,d,pn){
    switch(t.id){
      case 'DIGITMATCH':return d===t.b;
      case 'DIGITDIFF':return d!==t.b;
      case 'DIGITOVER':return d>t.b;
      case 'DIGITUNDER':return d<t.b;
      case 'DIGITEVEN':return d%2===0;
      case 'DIGITODD':return d%2===1;
      case 'CALL':return pn>t.entry;
      case 'PUT':return pn<t.entry;
      default:return pn!==t.entry;
    }
  }
  $('#unit').addEventListener('change',function(){applyLimits(true)});
  $('#contract').addEventListener('change',function(){applyContract()});
  $('#market').addEventListener('change',function(){
    mk=MK[+this.value];seed();restart();render();moveCursor(lastDigit,false);
    $('#status').textContent=mk.n+' loaded.';
  });

  function money(v){return(v>=0?'+':'\u2212')+Math.abs(v).toFixed(2)}
  function renderPnl(){
    var t=$('#total');t.textContent=money(pnl);t.className='total '+(pnl>0?'pos':pnl<0?'neg':'');
    $('#wins').textContent=wins;$('#losses').textContent=losses;
    var all=wins+losses;$('#rate').textContent=(all?Math.round(wins/all*100):0)+'%';
    $('#log').innerHTML=log.length?log.map(function(r){
      return'<li><span>'+r.t+'</span><span>'+r.label+' \u2022 exit '+r.x+'</span><span class="'+(r.amt>0?'pos':'neg')+'">'+money(r.amt)+'</span></li>';
    }).join(''):'<li class="empty" style="border:0;padding:0">No trades yet.</li>';
  }

  function tradeLine(){
    var line='No open trade';
    if(trade){
      if(trade.unit==='ticks')line=trade.label+' \u2022 '+trade.left+' tick'+(trade.left===1?'':'s')+' left';
      else{var s=Math.max(0,Math.ceil((trade.expiry-Date.now())/1000));line=trade.label+' \u2022 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' left'}
    }
    $('#tline').textContent=line;
    var lock=!!trade||busy;
    $('#scan').disabled=lock;$('#market').disabled=lock;$('#contract').disabled=lock;$('#barrier').disabled=lock;
  }

  function settle(d,win){
    var amt=win?+(trade.stake*(0.975/trade.p-1)).toFixed(2):-trade.stake;
    var x=/^DIGIT/.test(trade.id)?d:lastPrice;
    pnl=+(pnl+amt).toFixed(2);if(win)wins++;else losses++;
    log.unshift({t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),label:trade.label,x:x,amt:amt});
    if(log.length>6)log.length=6;
    $('#status').textContent=(win?'Won':'Lost')+'. Exit '+x+'. Scan again when ready.';
    trade=null;renderPnl();tradeLine();
  }

  function scan(){
    if(busy||trade)return;
    busy=true;$('#scan').classList.add('scanning');$('#stage').classList.add('scanning');
    $('#status').textContent='Scanning the last 25 ticks\u2026';tradeLine();
    setTimeout(function(){
      var w=ds.slice(-25),pw=ps.slice(-25),c=cfg(),id=PR[c.id][0],why='',ups=0,downs=0;
      for(var j=1;j<pw.length;j++){if(pw[j]>pw[j-1])ups++;else if(pw[j]<pw[j-1])downs++}
      var cnt=function(f){return w.filter(f).length};
      if(c.id==='DIGITEVEN'){var od=cnt(function(x){return x%2});id=od>25-od?'DIGITODD':'DIGITEVEN';why=(25-od)+' even, '+od+' odd'}
      else if(c.id==='DIGITOVER'){var ov=cnt(function(x){return x>c.b}),un=cnt(function(x){return x<c.b});id=ov>=un?'DIGITOVER':'DIGITUNDER';why=ov+' over, '+un+' under '+c.b}
      else if(c.id==='RUNHIGH'){id=ups>=downs?'RUNHIGH':'RUNLOW';why=ups+' ups, '+downs+' downs'}
      else if(c.id==='CALL'){id=ups>=downs?'CALL':'PUT';why=ups+' ups, '+downs+' downs'}
      var t=CT[id];
      trade={id:id,b:c.b,run:!!t.run,p:t.p(c.b,c.n),stake:c.stake,unit:c.unit,left:c.n,expiry:Date.now()+c.n*60000,entry:+lastPrice,last:+lastPrice,label:t.n+(c.b===null?'':' '+c.b)};
      busy=false;$('#scan').classList.remove('scanning');$('#stage').classList.remove('scanning');
      $('#status').textContent=trade.label+' opened'+(why?' ('+why+')':'')+'.';
      tradeLine();
    },2600);
  }
  $('#scan').addEventListener('click',scan);
  $('#reset').addEventListener('click',function(){pnl=0;wins=0;losses=0;log=[];renderPnl()});

  function tick(){
    var d=push(),pn=+lastPrice;render();moveCursor(d,true);
    if(trade){
      if(trade.run){
        var ok=trade.id==='RUNHIGH'?pn>trade.last:pn<trade.last;
        if(!ok)settle(d,false);
        else{trade.last=pn;if(--trade.left<=0)settle(d,true)}
      }else if(trade.unit==='ticks'){if(--trade.left<=0)settle(d,result(trade,d,pn))}
      else if(Date.now()>=trade.expiry)settle(d,result(trade,d,pn));
    }
    tradeLine();
  }
  function restart(){clearInterval(timer);timer=setInterval(tick,mk.ms)}
  restart();
  setInterval(tradeLine,250);
  window.addEventListener('resize',function(){moveCursor(lastDigit,false)});
  applyContract();render();renderPnl();tradeLine();
  setTimeout(function(){moveCursor(lastDigit,false)},50);
})();
</script>
</body>
</html>
